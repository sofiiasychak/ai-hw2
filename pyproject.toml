[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hw2"
version = "0.1.0"
description = "Object detection on VisDrone2019-VID drone clips (UCU AI 2026, HW2)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
